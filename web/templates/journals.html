<!DOCTYPE html>
<html lang="zh-CN">
<head>

<body class="journal-page">

<main class="wrap journal-list-page">
  <header class="article-head">
    <a class="back" href="/content#journals">← 返回</a>
    <a class="brand-logo topbar-brand" href="/" aria-label="海纳英才首页">
      <span class="logo-mark">{% include "_logo_white.html" %}</span>
      <span class="logo-text">海纳英才<span class="logo-en">Haina</span></span>

  </header>

  <h1 class="journal-list-title">期刊分级</h1>
  <p class="journal-list-desc">海洋学领域期刊分区速查，按研究方向分类查询。</p>

    <button class="jf-btn" data-cat="综合海洋">综合海洋</button>

  <div class="journal-grid" id="journalGrid">
    <p class="journal-loading">期刊数据加载中…</p>
  </div>

<script src="/static/js/journals-list.js"></script>
{% include "_feedback.html" %}
