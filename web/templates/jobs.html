<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>岗位库 · 海纳英才</title>
<link rel="stylesheet" href="/static/css/jobs.css">
<link rel="stylesheet" href="/static/css/enhance.css">
{% include "_analytics.html" %}
</head>
<body>
<header class="topbar">
  <a href="/content" class="back">← 首页</a>
  <div class="brand">岗位库</div>
</header>

<main class="wrap">
  <div class="search-row">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16" y2="16"></line></svg>
    <input type="search" id="jobSearch" placeholder="搜岗位名 / 单位，如：工程师、海洋所、三亚" autocomplete="off">
  </div>
  <button class="filter-toggle" id="filterToggle">筛选 <span class="toggle-arrow">▾</span></button>
  <section class="filters" id="filtersBox">
    <div class="filter-group">
      <div class="filter-label">专业方向</div>
      <div class="cascader" id="majorCascader">
        <div class="cascader-input" id="majorInput">全部方向 <span class="cascader-arrow">▾</span></div>
        <div class="cascader-panel major-panel" id="majorPanel" style="display:none">
          <div class="major-groups" id="majorGroups"></div>
        </div>
      </div>
      <div class="filter-tags" id="tags-majors"></div>
    </div>
    <div class="filter-group">
      <div class="filter-label">单位类型</div>
      <div class="filter-tags" id="tags-unit_types"></div>
    </div>
    <div class="filter-group">
      <div class="filter-label">学历</div>
      <div class="filter-tags" id="tags-educations"></div>
    </div>
    <div class="filter-group">
      <div class="filter-label">截止日期</div>
      <div class="filter-tags" id="tags-deadlines">
        <span class="tag active" data-dl="all">全部</span>
        <span class="tag" data-dl="has">有截止日期</span>
        <span class="tag" data-dl="none">未注明</span>
      </div>
    </div>
    <div class="filter-group">
      <div class="filter-label">薪资</div>
      <div class="filter-tags" id="tags-salary">
        <span class="tag active" data-salary="all">全部</span>
        <span class="tag" data-salary="has">有薪资</span>
      </div>
    </div>
    <div class="filter-group">
      <div class="filter-label">地区</div>
      <div class="cascader" id="regionCascader">
        <div class="cascader-input" id="regionInput">全部地区 <span class="cascader-arrow">▾</span></div>
        <div class="cascader-panel" id="regionPanel" style="display:none">
          <div class="cascader-col" id="cascader-province"></div>
          <div class="cascader-col" id="cascader-city"></div>
          <div class="cascader-col" id="cascader-district"></div>
        </div>
      </div>
      <div class="filter-tags" id="tags-regions"></div>
    </div>
    <div class="filter-bar">
      <span id="activeSummary">已选：无</span>
      <button id="clearAll" class="clear-btn">清空筛选</button>
    </div>
  </section>

  <div class="sort-bar">
    <span class="result-count" id="resultCount">加载中…</span>
    <div class="sort-options" id="sortOptions">
      <button class="sort-btn active" data-sort="latest">最新发布</button>
      <button class="sort-btn" data-sort="deadline">截止临近</button>
      <button class="sort-btn" data-sort="unit">单位名称</button>
    </div>
  </div>
  <div class="job-list" id="jobList"></div>
  <div class="empty" id="empty" style="display:none">
    没有符合条件的岗位。<br>试试放宽筛选，或过几天再来。岗位库还在积累。
  </div>
  <div class="pager" id="pager"></div>
</main>

<script src="/static/js/jobs.js"></script>
{% include "_feedback.html" %}
</body>
</html>
