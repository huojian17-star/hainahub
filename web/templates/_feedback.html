<!-- 意见反馈（全站悬浮按钮 + 弹窗，web 表单 → 后端代发邮件到站长反馈邮箱） -->
<style>
.haina-fb-btn {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 9999;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 9px 16px;
  border: 1px solid rgba(47, 212, 218, 0.45);
  border-radius: 999px;
  background: rgba(8, 26, 44, 0.88);
  color: #8FE8EC;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.06em;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
  backdrop-filter: blur(6px);
  transition: background .2s, transform .2s;
}
.haina-fb-btn:hover { background: rgba(20, 48, 74, 0.95); transform: translateY(-2px); }
.haina-fb-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10000;
  background: rgba(2, 8, 16, 0.6);
}
.haina-fb-modal.open { display: flex; align-items: center; justify-content: center; padding: 20px; }
.haina-fb-box {
  width: 100%;
  max-width: 420px;
  background: #0C2338;
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 14px;
  padding: 22px 24px;
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
}
.haina-fb-box h3 { color: #EAF6FF; font-size: 17px; margin-bottom: 6px; }
.haina-fb-tip { color: #9FB6CC; font-size: 12px; line-height: 1.6; margin-bottom: 14px; }
.haina-fb-box textarea {
  width: 100%;
  height: 110px;
  resize: vertical;
  background: #0E2A44;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 8px;
  color: #EAF6FF;
  font-size: 14px;
  padding: 10px 12px;
  outline: none;
  box-sizing: border-box;
}
.haina-fb-box textarea:focus { border-color: #2FD4DA; }
.haina-fb-box input {
  width: 100%;
  margin-top: 10px;
  background: #0E2A44;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 8px;
  color: #EAF6FF;
  font-size: 14px;
  padding: 9px 12px;
  outline: none;
  box-sizing: border-box;
}
.haina-fb-actions { display: flex; gap: 10px; margin-top: 14px; }
.haina-fb-submit {
  flex: 1;
  background: #2FD4DA;
  border: none;
  border-radius: 8px;
  color: #042E2B;
  font-size: 14px;
  font-weight: 700;
  padding: 10px 0;
  cursor: pointer;
}
.haina-fb-submit:disabled { opacity: 0.6; cursor: default; }
.haina-fb-cancel {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 8px;
  color: #C8DAEA;
  font-size: 14px;
  padding: 10px 22px;
  cursor: pointer;
}
@media (max-width: 720px) {
  .haina-fb-btn { right: 12px; bottom: 12px; padding: 8px 12px; font-size: 12px; }
}
</style>
<button class="haina-fb-btn" id="hainaFbBtn" aria-label="意见反馈">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
  反馈
</button>
<div class="haina-fb-modal" id="hainaFbModal">
  <div class="haina-fb-box">
    <h3>意见反馈</h3>
    <p class="haina-fb-tip">网站哪里不好用、想看什么内容、有什么建议——直接告诉我们。</p>
    <textarea id="hainaFbText" maxlength="2000" placeholder="写下你的反馈……"></textarea>
    <input type="text" id="hainaFbEmail" maxlength="100" placeholder="你的邮箱（选填，方便我们回复）">
    <input type="text" name="website" style="display:none" tabindex="-1" autocomplete="off">
    <div class="haina-fb-actions">
      <button class="haina-fb-submit" id="hainaFbSubmit">提交反馈</button>
      <button class="haina-fb-cancel" id="hainaFbCancel">取消</button>
    </div>
  </div>
</div>
<script>
(function () {
  var btn = document.getElementById("hainaFbBtn");
  var modal = document.getElementById("hainaFbModal");
  var submit = document.getElementById("hainaFbSubmit");
  var cancel = document.getElementById("hainaFbCancel");
  if (!btn || !modal) return;
  function open() { modal.classList.add("open"); }
  function close() {
    modal.classList.remove("open");
    document.getElementById("hainaFbText").value = "";
    document.getElementById("hainaFbEmail").value = "";
    submit.textContent = "提交反馈";
    submit.disabled = false;
  }
  btn.addEventListener("click", open);
  cancel.addEventListener("click", close);
  modal.addEventListener("click", function (e) { if (e.target === modal) close(); });
  submit.addEventListener("click", function () {
    var text = document.getElementById("hainaFbText").value.trim();
    if (!text) { alert("请先写下你的反馈"); return; }
    var fd = new FormData();
    fd.append("text", text);
    var email = document.getElementById("hainaFbEmail").value.trim();
    if (email) fd.append("email", email);
    var honey = modal.querySelector('input[name="website"]');
    if (honey && honey.value) fd.append("website", honey.value);
    submit.disabled = true;
    submit.textContent = "发送中……";
    fetch("/api/feedback", { method: "POST", body: fd })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.ok) {
          alert(d.message || "反馈已收到，谢谢");
          close();
        } else {
          alert(d.error || "发送失败");
          submit.textContent = "提交反馈";
          submit.disabled = false;
        }
      })
      .catch(function () { alert("发送失败，请稍后再试"); submit.textContent = "提交反馈"; submit.disabled = false; });
  });
})();
</script>
